name: validate-submissions
on:
  pull_request:
    paths: ['submissions/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Validate changed submissions
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          dirs=$(git diff --name-only "$base" "$head" -- 'submissions/**' | awk -F/ 'NF>=3{print $1"/"$2}' | sort -u)
          if [ -z "$dirs" ]; then echo "no submission dirs changed"; exit 0; fi
          fail=0
          for d in $dirs; do
            echo "=== $d ==="
            if [ ! -f "$d/course.html" ] || [ ! -f "$d/course.json" ]; then
              echo "::error::$d must contain exactly course.html and course.json"; fail=1; continue
            fi
            extras=$(ls "$d" | grep -v -E '^course\.(html|json)$' || true)
            if [ -n "$extras" ]; then echo "::error::$d has extra files: $extras"; fail=1; fi
            node scripts/validate-course.js "$d/course.html" "$d/course.json" || fail=1
          done
          exit $fail
